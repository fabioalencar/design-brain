<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>design-brain review</title>
<style>
  :root { --paper:#f6f5f1; --ink:#292929; --ink-2:#6b6b6b; --ink-3:#8f8f8f; --serif:Charter, "Source Serif Pro", "Iowan Old Style", Georgia, serif; --sans:-apple-system, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif; --line:#e6e4dd; --card:#ffffff;
          --accent:#5b48e8; --accent-soft:#ece9fc; --yes:#117a48; --yes-soft:#e2f4ea; --no:#b22a3d; --no-soft:#fbe8eb; }
  * { box-sizing:border-box }
  html,body { margin:0; background:var(--paper); color:var(--ink); font:16px/24px var(--sans); height:100% }
  body { display:flex; flex-direction:column; min-height:100vh; overflow:hidden }
  .wrap { width:min(720px, 100%); margin:0 auto; padding:0 20px; box-sizing:content-box }
  header { display:flex; align-items:center; gap:14px; padding:14px 0 6px; font-size:14px; line-height:24px; color:var(--ink-2); font-variant-numeric:tabular-nums }
  header b { color:var(--ink); font-weight:600 }
  header span { white-space:nowrap }
  header .bar { width:150px }
  header .tally { margin-left:auto }
  .bar { height:3px; background:var(--line); border-radius:2px; overflow:hidden }
  .bar i { display:block; height:100%; background:var(--accent); width:0; transition:width .3s }
  select, button { font:inherit }
  .toolbar { display:flex; align-items:center; gap:8px; padding:10px 0 12px }
  .toolbar select { appearance:none; -webkit-appearance:none; border:1px solid var(--line); background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8'><path d='M1.5 1.5l4.5 4.5 4.5-4.5' fill='none' stroke='%23777' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 12px center; box-shadow:0 1px 2px rgba(20,20,30,.05); padding:8px 34px 8px 12px; border-radius:8px; color:var(--ink); font-size:14px; line-height:20px; font-weight:500; cursor:pointer; transition:border-color .12s, box-shadow .12s }
  .toolbar select:hover { border-color:#cfcdc5 }
  .toolbar select:focus-visible { outline:0; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft) }
  .toolbar .compile { margin-left:auto; border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px; padding:8px 14px; font-size:14px; line-height:20px; font-weight:700; cursor:pointer; box-shadow:0 1px 2px rgba(20,20,30,.05); transition:border-color .12s, box-shadow .12s }
  .toolbar .compile:hover { border-color:#cfcdc5 }
  .toolbar .compile:focus-visible { outline:0; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft) }
  main { flex:1; min-height:0; display:grid; grid-template-columns:1fr minmax(0, 720px) 1fr; align-items:center; gap:16px; width:min(1100px, 100%); margin:0 auto; padding:0 20px }
  .side { border:0; border-radius:999px; padding:12px 22px; font-weight:600; color:#fff; cursor:pointer; justify-self:center; white-space:nowrap; display:inline-flex; align-items:center; gap:10px; font-size:16px }
  .side .arrow { font-size:24px; line-height:1; font-weight:400 }
  .side.no { background:var(--no) } .side.yes { background:var(--yes) }
  .stack { position:relative; width:100%; height:100%; max-height:820px; min-height:320px }
  .card { position:absolute; inset:0; background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:0 1px 2px rgba(20,20,30,.04), 0 16px 48px rgba(20,20,30,.07); padding:0; overflow:auto;
          display:flex; flex-direction:column; gap:0; transition:transform .35s cubic-bezier(.22,1,.36,1), opacity .3s; touch-action:none; user-select:none;
          mask-image:linear-gradient(to bottom, #000 calc(100% - 56px), transparent); -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 56px), transparent) }
  .card.top { animation:settle .32s cubic-bezier(.22,1,.36,1) }
  @keyframes settle { from { transform:translateY(10px); opacity:.6 } to { transform:none; opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .card, .card.top { animation:none; transition:none } }
  .card .head { position:sticky; top:0; z-index:2; background:var(--card); padding:28px 36px 16px; display:flex; flex-direction:column; gap:14px; transition:box-shadow .15s }
  .card .head.stuck { box-shadow:0 1px 0 var(--line), 0 8px 16px -12px rgba(20,20,30,.25) }
  .card .body { padding:4px 36px 44px; display:flex; flex-direction:column; gap:18px }
  .card .body > section, .card .head > h1, .card .body > .note { max-width:66ch }
  .card { z-index:3 }
  .card.next { z-index:2; transform:scale(.96) translateY(14px); opacity:.6; pointer-events:none }
  .card.next > *, .card.next2 > * { visibility:hidden }
  .card.next2 { z-index:1; transform:scale(.92) translateY(28px); opacity:.3; pointer-events:none }
  .card.gone-r { transform:translate(120%, -6%) rotate(12deg); opacity:0 }
  .card.gone-l { transform:translate(-120%, -6%) rotate(-12deg); opacity:0 }
  .card.gone-d { transform:translateY(120%); opacity:0 }
  .chiprow { display:flex; flex-direction:column; gap:10px }
  .chips { display:flex; gap:6px; flex-wrap:wrap; font-size:14px; align-items:center }
  .chips.metarow { gap:4px 18px; color:var(--ink-2) }
  .info { display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:rgba(0,0,0,.08); color:inherit; font:600 11px/1 -apple-system, system-ui, sans-serif; cursor:help; position:relative; margin-left:1px }
  .info::after { content:attr(data-tip); position:absolute; top:calc(100% + 8px); left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font:400 13px/20px -apple-system, system-ui, sans-serif; padding:8px 10px; border-radius:8px; white-space:pre-line; width:max-content; max-width:280px; text-align:left; opacity:0; pointer-events:none; transition:opacity .12s; z-index:5 }
  .info:hover::after, .info:focus-visible::after { opacity:1 }
  .info:focus-visible { outline:2px solid var(--accent); outline-offset:1px }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:999px; background:var(--accent-soft); color:var(--accent); border:0; font:600 14px/24px var(--sans) }
  .chip.meta { background:transparent; color:var(--ink-2); padding:0; font-weight:600 }
  .chip.meta em { opacity:.55 }
  .chip.meta.warn { color:#8c5a14 }
  .chip.meta + .chip.meta::before { content:""; }
  .chip em { font-style:normal; font-weight:500; opacity:.65 }
  .chip select, .chip input { appearance:none; -webkit-appearance:none; border:0; background:transparent; color:inherit; font:inherit; font-weight:600; padding:0; cursor:pointer }
  .chip select { padding-right:14px; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23666' stroke-width='1.5'/></svg>"); background-repeat:no-repeat; background-position:right 0 center }
  .chip input { width:30px; cursor:text; font-variant-numeric:tabular-nums }
  .addnote { flex:none; border:0; background:var(--paper); color:var(--ink-2); border-radius:999px; padding:5px 12px; font-size:14px; line-height:24px; font-weight:600; cursor:pointer }
  .addnote:hover { color:var(--ink) }
  section { border-top:1px solid var(--line); padding:22px 0 8px }
  section:first-of-type { border-top:0 }
  .modal-bg { position:fixed; inset:0; background:rgba(20,20,30,.35); display:none; align-items:center; justify-content:center; z-index:50 }
  .modal-bg.on { display:flex }
  .modal { background:var(--card); border-radius:14px; padding:22px 24px; width:min(560px, 92vw); box-shadow:0 20px 60px rgba(20,20,30,.2); display:flex; flex-direction:column; gap:12px }
  .modal h3 { margin:0; font-size:16px; font-weight:650 }
  .modal textarea { border:1px solid var(--line); border-radius:8px; padding:10px; font:inherit; font-size:16px; line-height:26px; min-height:120px; resize:vertical; background:var(--paper); color:var(--ink) }
  .modal .row { display:flex; justify-content:flex-end; gap:8px }
  .modal button { border:0; border-radius:999px; padding:9px 16px; font-weight:600; cursor:pointer; background:var(--paper); color:var(--ink) }
  .modal button.primary { background:var(--accent); color:#fff }
  .chip.dim { background:#eeeef2; color:var(--ink-2) }
  .chip.never, .chip.avoid { background:var(--no-soft); color:var(--no) }
  .chip.always { background:var(--yes-soft); color:var(--yes) }
  .chip.prefer, .chip.context { background:var(--accent-soft); color:var(--accent) }
  h1 { font:700 34px/42px var(--sans); letter-spacing:-.016em; margin:0; text-wrap:balance; color:#242424 }
  .id { font-size:14px; line-height:24px; color:var(--ink-3); font-variant-numeric:tabular-nums }
  .card .id { display:none }
  h2 { font:600 13px/22px var(--sans); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin:0 0 10px }
  .card p { margin:0; white-space:pre-wrap; text-wrap:pretty; font:400 20px/32px var(--serif); letter-spacing:-.003em; color:var(--ink) }
  .card p + p { margin-top:20px }
  section.quiet p, section.quiet li { color:var(--ink-2) }
  .note { background:#fcf2df; color:#8c5a14; padding:10px 14px; border-radius:8px; font:400 17px/28px var(--serif) }
  .card ul { margin:0; padding:0; list-style:none; color:var(--ink-2); font:400 18px/30px var(--serif); letter-spacing:-.003em }
  .card li { margin:0 0 12px; word-break:break-word; text-wrap:pretty }
  li .src { display:inline-block; font:600 11px/18px var(--sans); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); background:#f2f1ec; padding:0 7px; border-radius:4px; margin-right:8px; vertical-align:1px }
  li .ref { font:13px/24px ui-monospace, "JetBrains Mono", monospace; color:var(--ink-3); word-break:break-all }
  li .quote { color:var(--ink); }
  li .who { font-weight:600; color:var(--ink-2); margin-right:6px }
  code { font:.88em/1 ui-monospace, "JetBrains Mono", monospace; background:#f2f1ec; color:var(--ink-2); padding:2px 5px; border-radius:4px }
  .stamp { position:absolute; top:26px; font-size:34px; font-weight:800; letter-spacing:.06em; padding:4px 14px; border:4px solid; border-radius:10px; opacity:0; transform:rotate(-14deg); pointer-events:none; transition:opacity .1s }
  .stamp.yes { right:28px; color:var(--yes); border-color:var(--yes) }
  .stamp.no { left:28px; color:var(--no); border-color:var(--no); transform:rotate(14deg) }
  footer { display:flex; justify-content:center; gap:10px; padding:14px 20px 18px; flex-wrap:wrap }
  footer button, .side.mobile { border:0; border-radius:999px; padding:10px 18px; font-weight:600; cursor:pointer; background:var(--card); color:var(--ink) }
  kbd { font:11px ui-monospace, monospace; opacity:.6; margin-left:6px }
  footer .side.mobile { display:none }
  @media (max-width:900px) {
    main { grid-template-columns:1fr; gap:0 }
    main .side { display:none }
    footer .side.mobile { display:inline-block; color:#fff }
    footer .side.mobile.no { background:var(--no) } footer .side.mobile.yes { background:var(--yes) }
  }
  .toast { position:fixed; bottom:76px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:8px 14px; border-radius:8px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none }
  .toast.on { opacity:1 }
  .done { text-align:center; color:var(--ink-2) }
  .done b { display:block; font-size:28px; color:var(--ink); margin-bottom:8px }
  @media (max-width:640px) { .card .head { padding:18px 18px 10px } .card .body { padding:0 18px 28px } h1 { font-size:26px; line-height:34px } .card p { font-size:18px; line-height:29px } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <b>design-brain</b>
    <span id="count">…</span>
    <div class="bar"><i id="bar"></i></div>
    <span id="tally" class="tally"></span>
  </header>
  <div class="toolbar">
    <select id="fdim"><option value="">All dimensions</option></select>
    <select id="fscope"><option value="">All scopes</option><option>universal</option><option>personal</option></select>
    <select id="fkind"><option value="">All kinds</option><option>harvested</option><option>heuristic</option><option>bias</option><option>practice</option></select>
    <button class="compile" onclick="compile()">Compile skills <kbd>C</kbd></button>
  </div>
</div>
<main>
  <button class="side no" onclick="act('retire')"><span class="arrow">←</span>Retire</button>
  <div class="stack" id="stack"></div>
  <button class="side yes" onclick="act('promote')">Promote<span class="arrow">→</span></button>
</main>
<footer>
  <button class="side no mobile" onclick="act('retire')"><span class="arrow">←</span>Retire</button>
  <button onclick="act('skip')">Skip <kbd>↓</kbd></button>
  <button onclick="openNote()">Add note <kbd>N</kbd></button>
  <button onclick="undo()">Undo <kbd>Z</kbd></button>
  <button class="side yes mobile" onclick="act('promote')">Promote<span class="arrow">→</span></button>
</footer>
<div class="toast" id="toast"></div>
<div class="modal-bg" id="notebg" onclick="if (event.target === this) closeNote()">
  <div class="modal">
    <h3>Add note</h3>
    <div class="id" id="notetitle"></div>
    <textarea id="notetext" placeholder="Reword, narrow, merge with…, why you kept or dropped it. Saved into the file, dated."></textarea>
    <div class="row"><button onclick="closeNote()">Cancel <kbd>Esc</kbd></button><button class="primary" onclick="saveNote()">Save note <kbd>⌘↵</kbd></button></div>
  </div>
</div>
<script>
let all = [], queue = [], skipped = new Set(), history = [], tallies = { confirmed: 0, retired: 0 };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
try { skipped = new Set(JSON.parse(localStorage.getItem("db-skipped") || "[]")); } catch {}

async function load() {
  const r = await (await fetch("/api/queue")).json();
  all = r.queue; tallies = { confirmed: r.confirmed, retired: r.retired };
  const dims = [...new Set(all.map((c) => c.dimension))].sort();
  $("#fdim").innerHTML = '<option value="">All dimensions</option>' + dims.map((d) => `<option>${d}</option>`).join("");
  rebuild();
}
function rebuild() {
  const fd = $("#fdim").value, fs = $("#fscope").value, fk = $("#fkind").value;
  const vis = all.filter((c) => (!fd || c.dimension === fd) && (!fs || c.scope === fs) && (!fk || c.kind === fk));
  queue = [...vis.filter((c) => !skipped.has(c.id)), ...vis.filter((c) => skipped.has(c.id))];
  render();
}
function render() {
  const total = all.length + tallies.confirmed + tallies.retired;
  const done = tallies.confirmed + tallies.retired;
  $("#count").textContent = `${queue.length} in queue`;
  $("#tally").textContent = `${tallies.confirmed} promoted · ${tallies.retired} retired`;
  $("#bar").style.width = total ? (100 * done / total) + "%" : "0";
  const st = $("#stack"); st.innerHTML = "";
  if (!queue.length) { st.innerHTML = `<div class="card done"><div><b>Queue empty</b>Nothing left under this filter. Press C to compile the confirmed set into skills.</div></div>`; return; }
  queue.slice(0, 3).forEach((c, i) => st.appendChild(cardEl(c, i)));
  attachDrag(st.firstElementChild);
}
// evidence: `type:ref "quote"` → source tag, reference, quote
function evLine(e) {
  const m = String(e).match(/^([a-z]+):([^"]*?)\s*(?:"([\s\S]*)")?\s*$/i);
  if (!m) return `<li>${md(e)}</li>`;
  const [, type, ref, quote] = m;
  const label = { transcript: "said", repo: "repo", ddr: "DDR", audit: "audit", commit: "commit", note: "note", reference: "source", learnings: "learning" }[type.toLowerCase()] ?? type;
  const refHtml = ref.trim() ? `<span class="ref">${esc(ref.trim().replace(/^~\/Code\//, ""))}</span>` : "";
  const q = quote ? `<span class="quote">${type.toLowerCase() === "transcript" ? "“" + md(quote) + "”" : md(quote)}</span>` : "";
  return `<li><span class="src">${esc(label)}</span>${q}${q && refHtml ? "<br>" : ""}${refHtml}</li>`;
}
// examples: "- project — value — source" lines → rows with the first segment as a label
function listify(text) {
  if (!text) return "";
  const lines = text.split("\n").map((l) => l.trim()).filter(Boolean);
  if (!lines.every((l) => /^[-*]\s/.test(l))) return "";
  return lines.map((l) => {
    const body = l.replace(/^[-*]\s+/, "");
    const parts = body.split(/\s[—–]\s/);
    return parts.length > 1 ? `<li><span class="who">${md(parts[0])}</span>${md(parts.slice(1).join(" — "))}</li>` : `<li>${md(body)}</li>`;
  }).join("");
}
function source(c) {
  const n = Number(String(c.id).match(/(\d{3})$/)?.[1] ?? 0);
  if (c.kind === "heuristic") return "heuristic"; if (c.kind === "bias") return "bias"; if (c.kind === "practice") return "practice";
  if (n < 200) return "transcripts"; if (n < 300) return "forge record"; if (n < 400) return "design audits"; if (n < 500) return "repos and docs"; if (n < 600) return "imported project"; return "reference";
}
function cardEl(c, i) {
  const el = document.createElement("div");
  el.className = "card" + (i === 0 ? " top" : i === 1 ? " next" : " next2");
  el.dataset.id = c.id;
  const ev = c.evidence.map(evLine).join("");
  const exList = listify(c.examples), exBody = exList ? `<ul>${exList}</ul>` : c.examples && `<p>${md(c.examples)}</p>`;
  const opt = (list, cur) => list.map((s) => `<option ${s === cur ? "selected" : ""}>${s}</option>`).join("");
  const scopes = [...new Set(["universal", "personal", "project:" + (c.occurrences[0] || "x"), c.scope])];
  const sec = (title, body, quiet) => body ? `<section class="${quiet ? "quiet" : ""}"><h2>${title}</h2>${body}</section>` : "";
  el.innerHTML = `
    <div class="stamp yes">PROMOTE</div><div class="stamp no">RETIRE</div>
    <div class="head"><h1>${esc(c.title)}</h1>
      <div class="chips">
        <span class="chip ${esc(c.stance)}"><em>stance</em><select name="stance" onchange="this.parentNode.className='chip '+this.value">${opt(["always","never","prefer","avoid","context"], c.stance)}</select></span>
        <span class="chip dim"><em>confidence</em><input name="confidence" type="number" min="1" max="10" value="${c.confidence}"></span>
        <span class="chip dim"><em>scope</em><select name="scope">${opt(scopes, c.scope)}</select></span>
      </div>
    </div>
    <div class="body">
    <div class="chiprow">
      <div class="chips metarow">
        <span class="chip meta"><em>dimension</em>${esc(c.dimension)}</span>
        <span class="chip meta"><em>seen</em>${c.occurrences.length}×<span class="info" tabindex="0" data-tip="${esc(c.occurrences.join("\n"))}">i</span></span>
        <span class="chip meta"><em>source</em>${esc(source(c))}<span class="info" tabindex="0" data-tip="${esc(c.id)}\n${esc(c.file)}">i</span></span>
        ${c.kind !== "harvested" ? `<span class="chip meta"><em>kind</em>${esc(c.kind)}</span>` : ""}${c.component ? `<span class="chip meta"><em>component</em>${esc(c.component)}</span>` : ""}
        ${skipped.has(c.id) ? '<span class="chip meta">skipped earlier</span>' : ""}
        ${c.longParas ? `<span class="chip meta warn"><em>needs rewrite</em>${c.longParas} long paragraph${c.longParas > 1 ? "s" : ""}<span class="info" tabindex="0" data-tip="A Rule or Why paragraph runs past five rows. Split it by idea or move detail to Examples.">i</span></span>` : ""}
      </div>
    </div>
    <div class="id">${esc(c.id)} · seen in ${esc(c.occurrences.join(", "))}</div>
    ${c.review_note ? `<div class="note">${md(c.review_note)}</div>` : ""}
    ${sec("Rule", `<p>${md(c.rule)}</p>`)}
    ${sec("Why", c.why && `<p>${md(c.why).replace(/\n\n/g, "</p><p>")}</p>`, true)}
    ${sec("Examples", exBody, true)}
    ${sec("Exceptions", c.exceptions && `<p>${md(c.exceptions)}</p>`, true)}
    ${sec(`Evidence · ${c.evidence.length}`, `<ul>${ev}</ul>`, true)}
    ${sec("See also", c.seeAlso && `<p>${md(c.seeAlso)}</p>`, true)}
    ${sec("Review notes", c.notes && `<p>${md(c.notes)}</p>`)}
    </div>`;
  el.addEventListener("scroll", () => el.querySelector(".head").classList.toggle("stuck", el.scrollTop > 4), { passive: true });
  return el;
}
function edits(el, c) {
  const g = (n) => el.querySelector(`[name=${n}]`)?.value;
  const e = {};
  if (g("stance") && g("stance") !== c.stance) e.stance = g("stance");
  if (g("scope") && g("scope") !== c.scope) e.scope = g("scope");
  if (g("confidence") && Number(g("confidence")) !== Number(c.confidence)) e.confidence = Number(g("confidence"));
  return Object.keys(e).length ? e : undefined;
}
async function act(action) {
  const c = queue[0]; if (!c) return;
  const el = $("#stack").firstElementChild;
  if (action === "skip") { skipped.add(c.id); localStorage.setItem("db-skipped", JSON.stringify([...skipped])); el.classList.add("gone-d"); setTimeout(rebuild, 250); return; }
  const body = { id: c.id, action, edits: edits(el, c) };
  const r = await (await fetch("/api/verdict", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })).json();
  if (!r.ok) { toast("Error: " + r.error); return; }
  history.push({ card: c, undo: r.undo });
  el.classList.add(action === "promote" ? "gone-r" : "gone-l");
  toast(action === "promote" ? `Promoted as ${r.newId}` : `Retired ${c.id}`);
  all = all.filter((x) => x.id !== c.id); skipped.delete(c.id);
  tallies[action === "promote" ? "confirmed" : "retired"]++;
  setTimeout(rebuild, 280);
}
function openNote() { const c = queue[0]; if (!c) return; $("#notebg").classList.add("on"); $("#notetitle").textContent = c.id + " · " + c.title; const t = $("#notetext"); t.value = ""; setTimeout(() => t.focus(), 0); }
function closeNote() { $("#notebg").classList.remove("on"); }
async function saveNote() {
  const c = queue[0]; if (!c) return;
  const note = $("#notetext").value.trim();
  if (!note) { closeNote(); return; }
  const r = await (await fetch("/api/verdict", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ id: c.id, action: "note", edits: { note } }) })).json();
  if (!r.ok) { toast("Error: " + r.error); return; }
  closeNote(); toast("Note saved to " + c.id); await load();
}
async function undo() {
  const h = history.pop(); if (!h) { toast("Nothing to undo"); return; }
  const r = await (await fetch("/api/verdict", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(h.undo) })).json();
  if (!r.ok) { toast("Undo failed: " + r.error); return; }
  toast("Undone " + h.card.id); await load();
}
async function compile() {
  toast("Compiling…");
  const r = await (await fetch("/api/compile", { method: "POST" })).json();
  toast(r.ok ? r.out.trim() : "Compile failed: " + r.out);
}
function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 2200); }
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeNote(); return; }
  if ($("#notebg").classList.contains("on")) { if ((e.metaKey || e.ctrlKey) && e.key === "Enter") saveNote(); return; }
  if (["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) return;
  if (e.key === "ArrowRight") act("promote"); else if (e.key === "ArrowLeft") act("retire"); else if (e.key === "ArrowDown") act("skip");
  else if (e.key.toLowerCase() === "z") undo(); else if (e.key.toLowerCase() === "c") compile(); else if (e.key.toLowerCase() === "n") openNote();
});
$("#fdim").onchange = rebuild; $("#fscope").onchange = rebuild; $("#fkind").onchange = rebuild;

// Tinder-style drag on the top card (pointer events cover mouse + touch)
function attachDrag(el) {
  if (!el || !el.dataset.id) return;
  let sx = 0, sy = 0, dx = 0, dy = 0, on = false;
  const yes = el.querySelector(".stamp.yes"), no = el.querySelector(".stamp.no");
  el.addEventListener("pointerdown", (e) => { if (e.target.closest("a, ul, select, input, button")) return; on = true; sx = e.clientX; sy = e.clientY; el.setPointerCapture(e.pointerId); el.style.transition = "none"; });
  el.addEventListener("pointermove", (e) => { if (!on) return; dx = e.clientX - sx; dy = e.clientY - sy; el.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 18}deg)`; yes.style.opacity = Math.min(1, Math.max(0, dx / 120)); no.style.opacity = Math.min(1, Math.max(0, -dx / 120)); });
  const end = () => { if (!on) return; on = false; el.style.transition = ""; yes.style.opacity = 0; no.style.opacity = 0;
    if (dx > 140) act("promote"); else if (dx < -140) act("retire"); else if (dy > 160) act("skip"); else el.style.transform = ""; dx = dy = 0; };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}
load();
</script>
